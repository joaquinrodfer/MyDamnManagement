<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyDamnManagement</title>
<style>
  :root {
    --bg: #eff1f4;
    --panel: #ffffff;
    --panel-border: #d7dbe2;
    --ink: #1b1e24;
    --ink-muted: #565d6b;
    --accent: #b8763a;
    --accent-ink: #7a4d22;
    --accent-soft: rgba(184, 118, 58, 0.12);
    --ok: #2f9e5b;
    --down: #c94c4c;
    --down-bg: rgba(201, 76, 76, 0.12);
    --code-bg: #e7e9ee;
    --font-mono: "Cascadia Code", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-body: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b;
      --panel: #1b1e25;
      --panel-border: #2c303a;
      --ink: #e7e9ed;
      --ink-muted: #9aa1af;
      --accent: #e0994f;
      --accent-ink: #f4c493;
      --accent-soft: rgba(224, 153, 79, 0.15);
      --ok: #4fbf82;
      --down: #e2726f;
      --down-bg: rgba(226, 114, 111, 0.14);
      --code-bg: #22252d;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  input, select, textarea, button {
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- cabecera ---------- */
  header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }
  header .brand {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
  }
  .status-strip { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); }
  .status-item { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); }
  .dot.ok { background: var(--ok); }
  .dot.down { background: var(--down); }

  /* ---------- layout ---------- */
  .layout { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--panel-border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 28px 32px 60px;
  }

  /* ---------- sidebar ---------- */
  .sidebar-search { padding: 12px; border-bottom: 1px solid var(--panel-border); }
  .sidebar-search input {
    width: 100%;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: var(--bg);
    color: var(--ink);
  }
  .sidebar-section { padding: 10px 8px; }
  .sidebar-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .icon-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--ink-muted);
    width: 20px;
    height: 20px;
    line-height: 1;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: var(--code-bg); color: var(--ink); }

  .template-btn {
    background: none;
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    color: var(--ink-muted);
    font-size: 11px;
    padding: 2px 7px;
    line-height: 1.6;
  }
  .template-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--code-bg); }

  .tree-node { user-select: none; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tree-row:hover { background: var(--code-bg); }
  .tree-row.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  /* Selección múltiple (Ctrl/Mayús+clic) -- distinta de "active" (la página
     abierta ahora mismo): ambas pueden darse a la vez en la misma fila. */
  .tree-row-selected { outline: 1.5px solid var(--accent); outline-offset: -1.5px; background: var(--code-bg); }
  .tree-row .type-icon { flex-shrink: 0; opacity: 0.75; font-size: 12px; }
  .tree-children { margin-left: 16px; border-left: 1px solid var(--panel-border); padding-left: 4px; }

  .search-results { padding: 6px; }
  .search-hit {
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .search-hit:hover { background: var(--code-bg); }
  .search-empty { padding: 8px; font-size: 12.5px; color: var(--ink-muted); }

  /* ---------- botones ---------- */
  .btn {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--ink);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover { opacity: 0.9; color: #fff; }
  .btn-danger { color: var(--down); border-color: transparent; background: none; }
  .btn-danger:hover { background: var(--down-bg); border-color: var(--down); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- placeholder / vacío ---------- */
  .empty-state {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    font-size: 14px;
    text-align: center;
  }

  /* ---------- vista de nota ---------- */
  .note-header-image-wrap { margin-bottom: 16px; }
  .note-header-image {
    display: block;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .note-header-remove {
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }
  .note-header-remove:hover { color: var(--down); }

  .note-title-row { display: flex; align-items: baseline; gap: 8px; }
  .note-icon-input {
    font-size: 24px;
    width: 1.6em;
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--ink);
    padding: 4px 0;
    text-align: center;
    border-radius: 6px;
  }
  .note-icon-input:hover, .note-icon-input:focus { background: var(--code-bg); }
  .note-title {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    border: none;
    background: none;
    color: var(--ink);
    width: 100%;
    padding: 4px 0;
    margin-bottom: 4px;
  }
  .note-description {
    width: 100%;
    border: none;
    background: none;
    color: var(--ink-muted);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    padding: 2px 0 10px;
    resize: none;
    overflow: hidden;
  }
  .note-description:focus { color: var(--ink); }
  .note-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .panel-head {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 22px 0 8px;
  }

  /* ---------- editor de notas (CodeMirror) ---------- */
  /* El editor se monta directamente en #note-body; las clases .cm-* son
     de CodeMirror, .cm-mdm-* son las que le asigna frontend/editor-src. */
  #note-body {
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    overflow: hidden;
  }
  #note-body .cm-editor { outline: none; }
  #note-body .cm-content {
    padding: 14px 14px 14px 34px; /* el hueco de la izquierda es donde "flota" el handle de bloque */
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
    caret-color: var(--ink);
  }
  #note-body .cm-scroller { min-height: 260px; }
  #note-body .cm-cursor { border-left-color: var(--ink); }
  #note-body .cm-selectionBackground { background: var(--accent-soft) !important; }
  #note-body .cm-activeLine { background: transparent; }
  /* El handle de bloque es un widget dentro de la línea, no un gutter (ver
     el porqué en frontend/editor-src/entry.js) -- por eso la línea necesita
     position:relative, para que el handle se posicione contra ELLA y no
     contra todo el editor. */
  #note-body .cm-line { position: relative; }

  /* marcadores de sintaxis (#, **, *): visibles pero discretos. El propio
     parser de Markdown etiqueta "HeaderMark"/"EmphasisMark" con el mismo
     nodo que el encabezado/negrita que envuelven, así que un "#" dentro de
     un H1 llega con las dos clases a la vez (cm-mdm-h1 Y cm-mdm-mark) --
     el selector combinado de abajo es más específico y gana el tamaño. */
  .cm-mdm-mark, .cm-mdm-wikimark { color: var(--ink-muted); opacity: 0.55; }
  .cm-mdm-h1 { font-size: 1.7em; font-weight: 700; line-height: 1.3; }
  .cm-mdm-h2 { font-size: 1.4em; font-weight: 700; line-height: 1.3; }
  .cm-mdm-h3 { font-size: 1.15em; font-weight: 700; line-height: 1.3; }
  .cm-mdm-h4 { font-size: 1em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.3; }
  .cm-mdm-h1.cm-mdm-mark, .cm-mdm-h2.cm-mdm-mark, .cm-mdm-h3.cm-mdm-mark, .cm-mdm-h4.cm-mdm-mark {
    font-size: 0.7em;
    font-weight: 400;
    text-transform: none;
  }
  .cm-mdm-strong { font-weight: 700; }
  .cm-mdm-em { font-style: italic; }
  .cm-mdm-code { font-family: var(--font-mono); background: var(--code-bg); border-radius: 3px; padding: 0 3px; }
  .cm-mdm-wikilink { color: var(--accent-ink); text-decoration: underline; }
  .cm-mdm-wikilink-missing { color: var(--ink-muted); text-decoration: underline dotted; }

  /* fondo de línea para bloques de código/lista (calculado por bloques, ver
     frontend/editor-src/entry.js -- blockLineDecorations) */
  #note-body .cm-mdm-line-code { background: var(--code-bg); }
  #note-body .cm-mdm-line-list { padding-left: 4px; }

  /* ---------- handle de bloque (seleccionar/convertir/borrar) ----------
     Widget dentro de la línea (no gutter), posicionado en el hueco que deja
     el padding-left de .cm-content. top:0 + la propia línea como referencia
     (position:relative arriba) es lo que garantiza que quede a la altura
     exacta de la línea que le corresponde, sea un párrafo o un H1 más alto. */
  .cm-mdm-block-handle {
    position: absolute;
    left: -22px;
    top: 0;
    width: 18px;
    text-align: center;
    font-size: 11px;
    line-height: 1.7;
    color: var(--ink-muted);
    opacity: 0.28;
    cursor: pointer;
    user-select: none;
  }
  .cm-mdm-block-handle:hover { opacity: 0.75; }
  .cm-mdm-block-handle-selected { opacity: 1; color: var(--accent-ink); }

  /* ---------- menú contextual de bloques/páginas ---------- */
  .mdm-context-menu {
    position: fixed;
    z-index: 1000;
    min-width: 190px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    padding: 6px;
    font-size: 13px;
  }
  .mdm-context-menu-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 6px 10px 4px;
  }
  .mdm-context-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--ink);
    padding: 7px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
  }
  .mdm-context-menu-item:hover { background: var(--code-bg); }
  .mdm-context-menu-item.danger { color: var(--down); }
  .mdm-context-menu-item.danger:hover { background: var(--down-bg); }
  .mdm-context-menu-sep { height: 1px; background: var(--panel-border); margin: 5px 4px; }

  .backlinks-list { display: flex; flex-direction: column; gap: 4px; }
  .backlink-item {
    padding: 7px 10px;
    border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    cursor: pointer;
    font-size: 13px;
  }
  .backlink-item:hover { border-color: var(--accent); }

  /* ---------- vista de database ---------- */
  .db-header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .db-title {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    border: none;
    background: none;
    color: var(--ink);
    padding: 2px 0;
    min-width: 160px;
  }
  .db-schema-hint { font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; }
  .view-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .view-tab {
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--ink-muted);
  }
  .view-tab.active { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }

  table.rows-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .rows-table th, .rows-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--panel-border);
    font-variant-numeric: tabular-nums;
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rows-table th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); }
  .rows-table tr:hover td { background: var(--code-bg); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--panel-border); border-radius: 8px; }
  .table-wrap table { margin: 0; }

  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
  .board-col { flex: 0 0 240px; display: flex; flex-direction: column; gap: 8px; }
  .board-col-head {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-muted);
    padding: 4px 2px;
    display: flex;
    justify-content: space-between;
  }
  .board-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .board-card:hover { border-color: var(--accent); }
  .board-card-title { font-weight: 600; margin-bottom: 4px; }
  .board-card-prop { color: var(--ink-muted); font-size: 12px; }

  .row-del, .cell-del { color: var(--down); background: none; border: none; cursor: pointer; font-size: 13px; }

  /* ---------- formularios ---------- */
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--ink-muted); }
  .field input, .field select, .field textarea {
    padding: 6px 9px;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: var(--bg);
    color: var(--ink);
  }
  .inline-form {
    margin-top: 12px;
    padding: 14px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: var(--panel);
  }

  /* ---------- dialogs ---------- */
  dialog {
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px;
    background: var(--panel);
    color: var(--ink);
    width: min(440px, 92vw);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
  dialog h3 { font-family: var(--font-mono); margin: 0 0 14px; font-size: 16px; }
  .prop-row-wrap { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--panel-border); }
  .prop-row-wrap:last-child { border-bottom: none; }
  .prop-row { display: grid; grid-template-columns: 1fr 1fr 100px auto; gap: 6px; align-items: center; }
  .prop-row input, .prop-row select { padding: 5px 7px; border-radius: 5px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--ink); font-size: 12.5px; }
  .prop-options-input { width: 100%; margin-top: 6px; padding: 5px 7px; border-radius: 5px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--ink); font-size: 12.5px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <span class="brand">MyDamnManagement</span>
    <div class="status-strip">
      <span class="status-item"><span class="dot" id="dot-api"></span>api</span>
      <span class="status-item"><span class="dot" id="dot-db"></span>db</span>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="Buscar…" />
      </div>
      <div id="search-results" class="search-results" hidden></div>

      <div id="nav-sections">
        <div class="sidebar-section">
          <div class="sidebar-section-head">
            <span>Páginas</span>
            <button class="icon-btn" id="btn-new-note" title="Nueva nota">+</button>
          </div>
          <div id="tree-container"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-head">
            <span>Bases de datos</span>
            <div class="btn-row" style="gap: 4px;">
              <button class="template-btn" id="btn-template-crm" title="Nueva base de datos desde la plantilla CRM (Contactos)">CRM</button>
              <button class="template-btn" id="btn-template-tasks" title="Nueva base de datos desde la plantilla de Tareas">Tareas</button>
              <button class="icon-btn" id="btn-new-database" title="Nueva base de datos en blanco">+</button>
            </div>
          </div>
          <div id="db-tree-container"></div>
        </div>
      </div>
    </aside>

    <main id="main">
      <div class="empty-state">Elige una página o crea una nueva.</div>
    </main>
  </div>

  <dialog id="dialog-database">
    <h3>Nueva base de datos</h3>
    <div class="field">
      <label for="db-name">Nombre</label>
      <input type="text" id="db-name" placeholder="Contactos" />
    </div>
    <div class="field">
      <label>Propiedades</label>
      <div id="prop-rows"></div>
      <button type="button" class="btn" id="btn-add-prop" style="align-self: flex-start; margin-top: 4px;">+ Propiedad</button>
    </div>
    <div class="dialog-actions">
      <button class="btn" id="btn-cancel-database">Cancelar</button>
      <button class="btn btn-primary" id="btn-create-database">Crear</button>
    </div>
  </dialog>

  <dialog id="dialog-view">
    <h3>Nueva vista</h3>
    <div class="field">
      <label for="view-name">Nombre</label>
      <input type="text" id="view-name" placeholder="Ganados" />
    </div>
    <div class="field">
      <label for="view-type">Tipo</label>
      <select id="view-type">
        <option value="table">Tabla</option>
        <option value="board">Tablero (board)</option>
        <option value="list">Lista</option>
        <option value="calendar">Calendario</option>
      </select>
    </div>
    <div class="field" id="view-groupby-field" hidden>
      <label for="view-groupby">Agrupar por</label>
      <select id="view-groupby"></select>
    </div>
    <div class="dialog-actions">
      <button class="btn" id="btn-cancel-view">Cancelar</button>
      <button class="btn btn-primary" id="btn-create-view">Crear</button>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
