<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyDamnManagement — Estado</title>
<style>
  :root {
    --bg: #eff1f4;
    --panel: #ffffff;
    --panel-border: #d7dbe2;
    --ink: #1b1e24;
    --ink-muted: #565d6b;
    --accent: #b8763a;
    --accent-ink: #7a4d22;
    --ok: #2f9e5b;
    --ok-bg: rgba(47, 158, 91, 0.12);
    --down: #c94c4c;
    --down-bg: rgba(201, 76, 76, 0.12);
    --font-mono: "Cascadia Code", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-body: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b;
      --panel: #1b1e25;
      --panel-border: #2c303a;
      --ink: #e7e9ed;
      --ink-muted: #9aa1af;
      --accent: #e0994f;
      --accent-ink: #f4c493;
      --ok: #4fbf82;
      --ok-bg: rgba(79, 191, 130, 0.14);
      --down: #e2726f;
      --down-bg: rgba(226, 114, 111, 0.14);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  header { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-ink);
  }
  h1 { font-family: var(--font-mono); font-size: 24px; margin: 0; }
  .updated {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .grid { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .card-left { display: flex; align-items: center; gap: 12px; }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ink-muted);
    flex-shrink: 0;
    transition: background-color 0.2s ease;
  }
  .dot.ok { background: var(--ok); }
  .dot.down { background: var(--down); }

  .card-name { font-family: var(--font-mono); font-size: 14.5px; font-weight: 600; }
  .card-detail { font-size: 12.5px; color: var(--ink-muted); margin-top: 2px; }

  .pill {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .pill.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
  .pill.down { color: var(--down); background: var(--down-bg); border-color: var(--down); }
  .pill.pending { color: var(--ink-muted); background: transparent; border-color: var(--panel-border); }

  .error-banner {
    display: none;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--down);
    background: var(--down-bg);
    border: 1px solid var(--down);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .error-banner.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">MyDamnManagement</span>
      <h1>Estado de los servicios</h1>
      <span class="updated" id="updated">comprobando…</span>
    </header>

    <div class="error-banner" id="error-banner"></div>

    <div class="grid" id="grid">
      <div class="card" data-service="api">
        <div class="card-left">
          <span class="dot" id="dot-api"></span>
          <div>
            <div class="card-name">api</div>
            <div class="card-detail">FastAPI + Uvicorn</div>
          </div>
        </div>
        <span class="pill pending" id="pill-api">comprobando</span>
      </div>

      <div class="card" data-service="db">
        <div class="card-left">
          <span class="dot" id="dot-db"></span>
          <div>
            <div class="card-name">db</div>
            <div class="card-detail">postgres:16-alpine</div>
          </div>
        </div>
        <span class="pill pending" id="pill-db"></span>
      </div>
    </div>
  </main>

  <script>
    const POLL_MS = 4000;
    const updatedEl = document.getElementById("updated");
    const errorBanner = document.getElementById("error-banner");

    function setService(name, ok, detail) {
      const dot = document.getElementById(`dot-${name}`);
      const pill = document.getElementById(`pill-${name}`);
      dot.classList.toggle("ok", ok === true);
      dot.classList.toggle("down", ok === false);
      pill.classList.remove("pending", "ok", "down");
      pill.classList.add(ok ? "ok" : "down");
      pill.textContent = ok ? "activo" : "caído";
      if (detail) pill.title = detail;
    }

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString("es-ES", { hour12: false });
      } catch {
        return iso;
      }
    }

    async function poll() {
      try {
        const res = await fetch("/status", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        setService("api", data.services?.api?.ok ?? true);
        setService("db", data.services?.db?.ok ?? false, data.services?.db?.error);

        updatedEl.textContent = `última comprobación: ${formatTime(data.checked_at)}`;
        errorBanner.classList.remove("show");
      } catch (err) {
        setService("api", false);
        setService("db", false);
        errorBanner.textContent = `No se puede alcanzar la API: ${err.message}`;
        errorBanner.classList.add("show");
      }
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
