<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyDamnManagement</title>
<link rel="icon" href="/logo.png" />
<style>
  :root {
    color-scheme: dark;

    /* --- Superficies y bordes (Tema Oscuro por defecto) --- */
    --bg: #0f1117;               /* L = 0.0056 | Barra lateral, cabecera, carriles Kanban, barra nota */
    --panel: #161922;            /* L = 0.0098 | Lienzo principal (main), tabla de datos, inputs */
    --surface-elevated: #1e222e; /* L = 0.0162 | Tarjetas Kanban, diálogos <dialog>, menús flotantes, <th> */
    --panel-border: #2a2f3d;     /* L = 0.0286 | Divisores estructurales decorativos de 1px */
    --border-input: #6c7690;     /* L = 0.1816 | Bordes de controles interactivos (cumple >= 3:1 WCAG 1.4.11) */
    --code-bg: #202534;          /* L = 0.0188 | Bloques de código, citas y fondo :hover de filas/botones */

    /* --- Tipografía y tinta --- */
    --ink: #eef0f6;              /* L = 0.8715 | Texto primario (15.41:1 sobre --panel, 16.56:1 sobre --bg) */
    --ink-muted: #949db3;        /* L = 0.3366 | Texto secundario e iconos (6.46:1 sobre --panel, 6.95:1 sobre --bg) */

    /* --- Acento e interacción --- */
    --accent: #5e6ad2;           /* L = 0.1734 | Anillo :focus-visible y borde activo (3.74:1 sobre --panel, 4.02:1 sobre --bg) */
    --accent-btn: #4e5ac0;       /* L = 0.1274 | Fondo de botón primario .btn-primary */
    --accent-contrast: #ffffff;  /* L = 1.0000 | Texto sobre .btn-primary (5.92:1 sobre --accent-btn) */
    --accent-ink: #9ba4ff;       /* L = 0.4074 | Wikilinks, pestañas activas, fila activa (7.65:1 sobre --panel) */
    --accent-soft: rgba(94, 106, 210, 0.18); /* Compuesto: #1d2139 sobre --bg (L=0.0164), #232842 sobre --panel (L=0.0227) */

    /* --- Estados semánticos --- */
    --ok: #3dd68c;               /* L = 0.5098 | Online / completado (9.36:1 sobre --panel, 10.06:1 sobre --bg) */
    --warn: #f5a623;             /* L = 0.4681 | En curso / aviso (8.66:1 sobre --panel, 9.31:1 sobre --bg) */
    --down: #f26464;             /* L = 0.2891 | Peligro / error / vencido (5.67:1 sobre --panel, 6.09:1 sobre --bg) */
    --down-bg: rgba(242, 100, 100, 0.15);    /* Compuesto: #37242c sobre --panel (L=0.0226; --down da 4.67:1) */

    /* --- Tipografía (pilas del sistema, cero fuentes remotas) --- */
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Cascadia Code", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* --- Escala tipográfica --- */
    --text-xs: 10.5px;
    --text-sm: 11.5px;
    --text-base: 13px;
    --text-md: 13.5px;
    --text-prose: 14.5px;
    --text-lg: 16px;
    --text-db-title: 21px;
    --text-note-title: 24px;

    /* --- Radios --- */
    --radius-xs: 3px;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;

    /* --- Espaciado y dimensiones clave --- */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 22px;
    --space-6: 28px;
    --control-size: 28px;        /* Tamaño mínimo de botones de icono y asas de bloque (>= 24x24 WCAG 2.5.8) */
    --header-height: 40px;
    --sidebar-width: 248px;
    --sidebar-width-compact: 220px;
    --note-max-width: 780px;

    /* --- Sombras --- */
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    --shadow-float: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.07);
    --shadow-toast: 0 8px 24px rgba(0, 0, 0, 0.45);

    /* --- Duraciones y curvas de movimiento --- */
    --dur-fast: 120ms;
    --dur-normal: 160ms;
    --dur-spin: 700ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-std: ease;
  }

  html[data-theme="light"] {
    color-scheme: light;

    --bg: #f3f4f8;               /* L = 0.9053 */
    --panel: #ffffff;            /* L = 1.0000 */
    --surface-elevated: #f8f9fc; /* L = 0.9474 */
    --panel-border: #d8dce6;     /* L = 0.7150 */
    --border-input: #798295;     /* L = 0.2220 (3.86:1 sobre --panel, 3.67:1 sobre --surface-elevated, 3.51:1 sobre --bg) */
    --code-bg: #eaedf4;          /* L = 0.8459 */

    --ink: #11141c;              /* L = 0.0070 (18.41:1 sobre --panel, 16.75:1 sobre --bg) */
    --ink-muted: #525a6e;        /* L = 0.1023 (6.89:1 sobre --panel, 6.27:1 sobre --bg) */

    --accent: #434ce6;           /* L = 0.1208 (6.15:1 sobre --panel, 5.59:1 sobre --bg) */
    --accent-btn: #3b44d1;       /* L = 0.0967 */
    --accent-contrast: #ffffff;  /* L = 1.0000 (7.16:1 sobre --accent-btn) */
    --accent-ink: #323ab8;       /* L = 0.0716 (8.63:1 sobre --panel, 7.85:1 sobre --bg) */
    --accent-soft: rgba(67, 76, 230, 0.10); /* Compuesto: #e1e3f6 sobre --bg (L=0.7760), #ecedfc sobre --panel (L=0.8543) */

    --ok: #18794e;               /* L = 0.1442 (5.41:1 sobre --panel, 4.92:1 sobre --bg) */
    --warn: #b45309;             /* L = 0.1591 (5.02:1 sobre --panel, 4.57:1 sobre --bg) */
    --down: #c81e1e;             /* L = 0.1330 (5.74:1 sobre --panel, 5.22:1 sobre --bg) */
    --down-bg: rgba(200, 30, 30, 0.10);     /* Compuesto: #fae8e8 sobre --panel (L=0.8386; --down da 4.86:1) */

    --shadow-card: 0 1px 2px rgba(17, 20, 28, 0.06);
    --shadow-float: 0 12px 32px rgba(17, 20, 28, 0.16);
    --shadow-toast: 0 6px 18px rgba(17, 20, 28, 0.14);
  }

  /* Utilidad de accesibilidad para texto solo visible a lectores de pantalla */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Conmutación del icono en #btn-toggle-theme según el tema activo */
  html[data-theme="dark"] .theme-icon-dark { display: none; }
  html[data-theme="light"] .theme-icon-light { display: none; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  input, select, textarea, button {
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- iconos del sprite ---------- */
  .svg-icon {
    display: inline-block;
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .svg-icon.icon-18 { width: 18px; height: 18px; }
  .svg-icon.icon-20 { width: 20px; height: 20px; }

  /* ---------- cabecera ---------- */
  header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
  }
  .brand-logo { width: 22px; height: 22px; border-radius: 50%; display: block; }
  .status-strip { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); }
  .status-item { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); }
  .dot.ok { background: var(--ok); }
  .dot.down { background: var(--down); }

  /* ---------- layout ---------- */
  .layout { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--panel-border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  /* Colapsar del todo (display:none) en vez de width:0 -- así no hay que
     lidiar con que el contenido interno (búsqueda, árbol) se reajuste o se
     desborde durante la transición; solo aparece/desaparece. */
  .layout.sidebar-collapsed aside { display: none; }

  main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 28px 32px 60px;
  }

  /* ---------- sidebar ---------- */
  .sidebar-search { padding: 12px; border-bottom: 1px solid var(--panel-border); }
  .sidebar-search input {
    width: 100%;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-input);
    background: var(--bg);
    color: var(--ink);
  }
  .sidebar-section { padding: 10px 8px; }
  .sidebar-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .icon-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--ink-muted);
    width: var(--control-size);
    height: var(--control-size);
    min-width: 28px;
    min-height: 28px;
    padding: 0;
    line-height: 1;
    font-size: 13.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color var(--dur-fast) var(--ease-std), color var(--dur-fast) var(--ease-std), border-color var(--dur-fast) var(--ease-std);
  }
  .icon-btn:hover { background: var(--code-bg); color: var(--ink); border-color: var(--panel-border); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .icon-btn:disabled:hover { background: none; color: var(--ink-muted); }

  /* ---------- navegación (atrás/adelante/subir), en la cabecera ---------- */
  .header-left { display: flex; align-items: center; gap: 14px; }
  .nav-history-controls { display: flex; gap: 4px; }

  .template-btn {
    background: none;
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    color: var(--ink-muted);
    font-size: 11px;
    padding: 2px 7px;
    line-height: 1.6;
  }
  .template-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--code-bg); }

  .tree-node { user-select: none; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tree-row:hover { background: var(--code-bg); }
  .tree-row.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  /* Selección múltiple (Ctrl/Mayús+clic) -- distinta de "active" (la página
     abierta ahora mismo): ambas pueden darse a la vez en la misma fila. */
  .tree-row-selected { outline: 1.5px solid var(--accent); outline-offset: -1.5px; background: var(--code-bg); }
  .tree-row .type-icon {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .tree-row.active .type-icon { color: var(--accent-ink); }
  .tree-children { margin-left: 16px; border-left: 1px solid var(--panel-border); padding-left: 4px; }

  .search-results { padding: 6px; }
  .search-hit {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .search-hit:hover { background: var(--code-bg); }
  .search-empty { padding: 8px; font-size: 12.5px; color: var(--ink-muted); }

  /* ---------- botones ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--ink);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary {
    background: var(--accent-btn);
    border-color: var(--accent);
    color: var(--accent-contrast);
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.1); background: var(--accent-btn); border-color: var(--accent); color: var(--accent-contrast); }
  .btn-danger { color: var(--down); border-color: transparent; background: none; }
  .btn-danger:hover { background: var(--down-bg); border-color: var(--down); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- placeholder / vacío ---------- */
  .empty-state {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    font-size: 14px;
    text-align: center;
  }

  /* ---------- landing / dashboard (nada abierto -- ver renderDashboard) ---------- */
  .dashboard { max-width: 640px; display: flex; flex-direction: column; gap: 28px; }
  .dashboard-section-head {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .dashboard-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .dashboard-item:hover { background: var(--code-bg); }
  .dashboard-item-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    color: var(--ink-muted);
  }
  .dashboard-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dashboard-item-sub { color: var(--ink-muted); font-size: 12.5px; }
  .dashboard-item-meta { flex-shrink: 0; font-size: 12px; color: var(--ink-muted); font-family: var(--font-mono); }
  .dashboard-item-meta.overdue { color: var(--down); }

  /* ---------- vista de nota ---------- */
  .note-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    min-height: 22px;
  }
  .note-savestatus {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .note-savestatus.is-error { color: var(--down); }
  .note-topbar-right { display: flex; align-items: center; gap: 10px; }
  .note-savestatus-icon { display: inline-flex; width: 12px; height: 12px; align-items: center; justify-content: center; font-size: 11px; }
  .spinner {
    width: 11px;
    height: 11px;
    border: 1.6px solid var(--panel-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: mdm-spin 0.7s linear infinite;
  }
  @keyframes mdm-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--accent); }
  }

  .note-backlinks-dropdown { font-size: 12px; color: var(--ink-muted); }
  .note-backlinks-dropdown summary {
    cursor: pointer;
    list-style: none;
    font-family: var(--font-mono);
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .note-backlinks-dropdown summary::-webkit-details-marker { display: none; }
  .note-backlinks-dropdown summary::before { content: none; }
  /* El chevron ▸/▾ es un SVG real dentro del <summary> (SPEC-B §6.3 filas 12-13). */
  .note-backlinks-dropdown .back-chevron-open { display: none; }
  .note-backlinks-dropdown[open] .back-chevron-closed { display: none; }
  .note-backlinks-dropdown[open] .back-chevron-open { display: inline-block; }
  .note-backlinks-dropdown .backlinks-list { margin-top: 8px; }

  /* ---------- índice (H1-H5) -- desplegable en la propia barra de la nota:
     el <details> vive dentro de .note-topbar-right (ver createOutlinePanel/
     renderOutline en app.js) y solo su lista flota, así que el botón se
     alinea en fila con Backlinks y Exportar en vez de taparlos. */
  .note-outline-dropdown {
    position: relative;
    font-size: 12px;
    color: var(--ink);
  }
  .note-outline-dropdown summary {
    cursor: pointer;
    list-style: none;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-muted);
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .note-outline-dropdown summary::-webkit-details-marker { display: none; }
  .note-outline-dropdown summary::before { content: none; }
  .note-outline-dropdown .note-outline-list {
    position: absolute;
    top: calc(100% + 5px);
    right: 0;
    z-index: 900;
    width: 240px;
    max-height: 60vh;
    overflow-y: auto;
    background: var(--surface-elevated);
    border: 1px solid var(--border-input);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-float);
    padding: 6px;
    margin-top: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .note-outline-item {
    padding: 5px 7px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-outline-item:hover { background: var(--code-bg); }

  .note-header-image-wrap { margin-bottom: 16px; }
  .note-header-image {
    display: block;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .note-header-remove {
    background: var(--surface-elevated);
    border: 1px solid var(--border-input);
    border-radius: var(--radius-sm);
    color: var(--ink-muted);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 10px;
    min-height: var(--control-size);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .note-header-remove:hover { color: var(--down); border-color: var(--down); background: var(--down-bg); }

  .note-title-row { display: flex; align-items: baseline; gap: 8px; }
  .note-icon-btn {
    font-size: 24px;
    width: 1.6em;
    height: 1.6em;
    flex-shrink: 0;
    border: none;
    background: none;
    padding: 0;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
    line-height: 1;
  }
  .note-icon-btn:hover, .note-icon-btn:focus-visible { background: var(--code-bg); }
  .note-title {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    border: none;
    background: none;
    color: var(--ink);
    width: 100%;
    padding: 4px 0;
    margin-bottom: 4px;
  }
  .note-description {
    width: 100%;
    border: none;
    background: none;
    color: var(--ink-muted);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    padding: 2px 0 10px;
    resize: none;
    overflow: hidden;
  }
  .note-description:focus { color: var(--ink); }
  .note-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 22px 0 8px;
  }

  /* ---------- editor de notas (CodeMirror) ---------- */
  /* El editor se monta directamente en #note-body; las clases .cm-* son
     de CodeMirror, .cm-mdm-* son las que le asigna frontend/editor-src.
     Deliberadamente sin caja/borde propios: es el cuerpo de la página, no
     una sección aparte (estilo Notion) -- incluso ocupa todo el ancho de
     #main, igual que el título. */
  #note-body .cm-editor { outline: none; background: transparent; }
  #note-body .cm-content {
    padding: 4px 4px 220px 64px; /* la izquierda aloja las dos asas de bloque de 28x28 (28+2+28 = 58px) + 2px de aire; el hueco de
       abajo es a propósito -- clicar ahí (como en Notion) coloca el cursor al final del documento */
    font-family: var(--font-body); /* prosa con pinta de Notion; el código se fuerza aparte a --font-mono */
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    caret-color: var(--ink);
  }
  #note-body .cm-cursor { border-left-color: var(--ink); }
  #note-body .cm-selectionBackground { background: var(--accent-soft) !important; }
  #note-body .cm-activeLine { background: transparent; }
  /* El handle de bloque es un widget dentro de la línea, no un gutter (ver
     el porqué en frontend/editor-src/entry.js) -- por eso la línea necesita
     position:relative, para que el handle se posicione contra ELLA y no
     contra todo el editor. */
  #note-body .cm-line { position: relative; }

  /* marcadores de sintaxis (#, **, *): visibles pero discretos. El propio
     parser de Markdown etiqueta "HeaderMark"/"EmphasisMark" con el mismo
     nodo que el encabezado/negrita que envuelven, así que un "#" dentro de
     un H1 llega con las dos clases a la vez (cm-mdm-h1 Y cm-mdm-mark) --
     el selector combinado de abajo es más específico y gana el tamaño. */
  .cm-mdm-mark, .cm-mdm-wikimark { color: var(--ink-muted); opacity: 0.55; }
  .cm-mdm-h1 { font-size: 1.9em; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
  .cm-mdm-h2 { font-size: 1.5em; font-weight: 700; line-height: 1.3; letter-spacing: -0.005em; }
  .cm-mdm-h3 { font-size: 1.25em; font-weight: 700; line-height: 1.3; }
  .cm-mdm-h4 { font-size: 1.05em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.3; }
  .cm-mdm-h5 { font-size: 0.95em; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.3; }
  .cm-mdm-h1.cm-mdm-mark, .cm-mdm-h2.cm-mdm-mark, .cm-mdm-h3.cm-mdm-mark, .cm-mdm-h4.cm-mdm-mark, .cm-mdm-h5.cm-mdm-mark {
    font-size: 0.7em;
    font-weight: 400;
    color: var(--ink-muted);
    text-transform: none;
  }
  .cm-mdm-strong { font-weight: 700; }
  .cm-mdm-em { font-style: italic; }
  .cm-mdm-code { font-family: var(--font-mono); background: var(--code-bg); border-radius: 3px; padding: 0 3px; }
  .cm-mdm-wikilink { color: var(--accent-ink); text-decoration: underline; }
  .cm-mdm-wikilink-missing { color: var(--ink-muted); text-decoration: underline dotted; }
  /* Wikilink resuelto y sin editar ahora mismo: sustituye "[[...]]" entero,
     se ve como un enlace normal -- ver WikilinkWidget en entry.js. */
  .cm-mdm-wikilink-rendered {
    color: var(--accent-ink);
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--accent-ink) 40%, transparent);
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .cm-mdm-wikilink-rendered:hover { text-decoration-color: var(--accent-ink); }
  /* Enlace Markdown "[texto](url)" resuelto y sin editar: sustituye todo el
     "[texto](url)" por solo "texto" con pinta de enlace -- ver
     MarkdownLinkWidget en entry.js. Mismo aspecto que un wikilink resuelto,
     clase propia porque el destino es una URL, no una página del workspace. */
  .cm-mdm-mdlink-rendered {
    color: var(--accent-ink);
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--accent-ink) 40%, transparent);
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .cm-mdm-mdlink-rendered:hover { text-decoration-color: var(--accent-ink); }
  /* Enlace Markdown en edición (cursor dentro): el texto entre corchetes se
     ve ya con pinta de enlace, aunque siga siendo Markdown crudo y editable. */
  .cm-mdm-mdlink-text { color: var(--accent-ink); text-decoration: underline; }
  /* "->" / "<-" / "<->" sin editar: se ven como →/←/↔ (ver arrowPlugin). */
  .cm-mdm-glyph { color: var(--ink); }
  /* Línea horizontal ("---"): widget de bloque cuando no se edita (ver HRWidget) */
  .cm-mdm-hr { border: none; border-top: 1px solid var(--panel-border); margin: 12px 0; height: 0; }

  /* fondo de línea para bloques de código/lista (calculado por bloques, ver
     frontend/editor-src/entry.js -- blockLineDecorations). El código fuerza
     --font-mono aquí -- .cm-content ya no es monoespaciada (ver más arriba),
     así que sin esto el código se vería con la misma fuente que la prosa. */
  #note-body .cm-mdm-line-code { background: var(--code-bg); font-family: var(--font-mono); }
  #note-body .cm-mdm-line-list { padding-left: 4px; }

  /* ---------- citas ("> texto", anidables con "> > texto") ----------
     Fondo gris clarito (el mismo --code-bg que el código) con bordes
     redondeados arriba/abajo -- ver quoteDecorations en entry.js, que
     marca la primera/última línea de cada cita para poder redondear solo
     esas esquinas y que las líneas de en medio se vean como un bloque
     continuo, no una fila de rectángulos sueltos. Una barra de color de
     acento por nivel de anidación, calculada línea a línea contando los
     ">" -- solo aparece mientras la cita no se está editando (mismo
     patrón cursor-aware que el resto: en edición se ve el Markdown crudo,
     con el ">" tenue). */
  #note-body .cm-mdm-line-quote { background: var(--code-bg); padding: 3px 12px; }
  #note-body .cm-mdm-line-quote-first { border-radius: 8px 8px 0 0; padding-top: 8px; }
  #note-body .cm-mdm-line-quote-last { border-radius: 0 0 8px 8px; padding-bottom: 8px; }
  .cm-mdm-quote-bars { display: inline-flex; gap: 4px; margin-right: 10px; vertical-align: middle; }
  .cm-mdm-quote-bar { display: inline-block; width: 3px; height: 1.1em; border-radius: 2px; background: var(--accent); vertical-align: middle; }

  /* Líneas en blanco usadas solo para separar bloques en Markdown: se
     colapsan casi a 0 mientras no se está escribiendo ahí (cursor-aware,
     ver blankLineDecorations en entry.js) -- el espacio real entre bloques
     ya no sale de aquí, sino de cm-mdm-space-* (ver más abajo); esto solo
     evita que el salto de línea que exige Markdown se vea como un hueco. */
  #note-body .cm-mdm-blank-collapsed { font-size: 1px; line-height: 3px; }

  /* ---------- separación entre bloques (al estilo Notion) ----------
     Padding-top en la PRIMERA línea de cada bloque, según su tipo -- ver
     blockSpacingDecorations en entry.js. Un H1 deja mucho más aire por
     encima que un párrafo suelto; los ítems de una misma lista no llevan
     nada extra entre sí (deben quedar juntos). El asa de bloque se
     reposiciona con el mismo valor (selector combinado más abajo) para
     seguir alineada con el texto, que ahora empieza más abajo que la
     propia línea. */
  #note-body .cm-mdm-space-normal { padding-top: 6px; }
  #note-body .cm-mdm-space-h1 { padding-top: 34px; }
  #note-body .cm-mdm-space-h2 { padding-top: 26px; }
  #note-body .cm-mdm-space-h3 { padding-top: 20px; }
  #note-body .cm-mdm-space-h4 { padding-top: 14px; }
  #note-body .cm-mdm-space-h5 { padding-top: 12px; }

  /* ---------- handle de bloque (seleccionar/convertir/borrar) + botón "+" ----------
     Widget dentro de la línea (no gutter), posicionado en el hueco que deja
     el padding-left de .cm-content. top:0 + la propia línea como referencia
     (position:relative arriba) es lo que garantiza que quede a la altura
     exacta de la línea que le corresponde, sea un párrafo o un H1 más alto
     -- el selector combinado con cada cm-mdm-space-* reajusta ese "top"
     cuando la línea además tiene padding-top propio (ver más arriba), para
     que el asa siga a la altura del texto y no del borde superior de la
     línea. El "+" y el "⋮⋮" comparten el mismo wrapper para no necesitar
     dos widgets (y por tanto dos cálculos de posición) por bloque.
     Invisible por defecto -- solo aparece al pasar el ratón por ESA línea
     (o por el propio asa, que sigue contando como parte de ella). */
  .cm-mdm-block-handle-wrap {
    position: absolute;
    left: -60px;
    top: 0;
    display: flex;
    align-items: center;
    gap: 2px;
    line-height: 1.6;
    opacity: 0;
    transition: opacity var(--dur-fast) var(--ease-std);
  }
  /* Al recibir foco por teclado (:focus-within) el contenedor entero pasa a
     opacity: 1, para que el anillo :focus-visible de 2px se pinte al 100 %. */
  #note-body .cm-line:hover .cm-mdm-block-handle-wrap,
  #note-body .cm-line:focus-within .cm-mdm-block-handle-wrap,
  .cm-mdm-block-handle-wrap:focus-within,
  .cm-mdm-block-handle-wrap:has(.cm-mdm-block-handle-selected) {
    opacity: 1;
  }
  #note-body .cm-mdm-space-h1 > .cm-mdm-block-handle-wrap { top: 34px; }
  #note-body .cm-mdm-space-h2 > .cm-mdm-block-handle-wrap { top: 26px; }
  #note-body .cm-mdm-space-h3 > .cm-mdm-block-handle-wrap { top: 20px; }
  #note-body .cm-mdm-space-h4 > .cm-mdm-block-handle-wrap { top: 14px; }
  #note-body .cm-mdm-space-h5 > .cm-mdm-block-handle-wrap { top: 12px; }
  #note-body .cm-mdm-space-normal > .cm-mdm-block-handle-wrap { top: 6px; }
  .cm-mdm-block-add,
  .cm-mdm-block-handle {
    width: 28px;
    height: 28px;
    min-width: 28px;
    min-height: 28px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: none;
    text-align: center;
    font-size: 15px;
    line-height: 1;
    color: var(--ink-muted);
    opacity: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .cm-mdm-block-add:hover,
  .cm-mdm-block-handle:hover { background: var(--code-bg); color: var(--ink); border-color: var(--panel-border); }
  .cm-mdm-block-handle-selected { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); opacity: 1; }

  /* ---------- menú contextual de bloques/páginas ---------- */
  .mdm-context-menu {
    position: fixed;
    z-index: 1000;
    min-width: 190px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    padding: 6px;
    font-size: 13px;
  }
  .mdm-context-menu-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 6px 10px 4px;
  }
  .mdm-context-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--ink);
    padding: 7px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
  }
  .mdm-context-menu-item:hover { background: var(--code-bg); }
  .mdm-context-menu-item.danger { color: var(--down); }
  .mdm-context-menu-item.danger:hover { background: var(--down-bg); }
  .mdm-context-menu-sep { height: 1px; background: var(--panel-border); margin: 5px 4px; }

  /* ---------- selector de emojis ---------- */
  .mdm-emoji-picker {
    position: fixed;
    z-index: 1000;
    width: 280px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    padding: 10px;
  }
  .mdm-emoji-search {
    width: 100%;
    padding: 6px 9px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid var(--border-input);
    background: var(--bg);
    color: var(--ink);
  }
  .mdm-emoji-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    max-height: 220px;
    overflow-y: auto;
  }
  .mdm-emoji-option {
    font-size: 19px;
    line-height: 1;
    padding: 6px 0;
    background: none;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .mdm-emoji-option:hover { background: var(--code-bg); }

  /* ---------- menú "/" (tipos de bloque) ---------- */
  .mdm-slash-menu {
    position: fixed;
    z-index: 1000;
    min-width: 200px;
    max-height: 260px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    padding: 6px;
  }
  .mdm-slash-menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
  }
  .mdm-slash-menu-item.active { background: var(--accent-soft); color: var(--accent-ink); }
  .mdm-slash-menu-abbrev { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }
  .mdm-slash-menu-item.active .mdm-slash-menu-abbrev { color: var(--accent-ink); opacity: 0.75; }
  /* Aviso flotante del modo "naming" del comando /page (ver slashMenuExtension
     en entry.js) -- solo texto, no hay nada que elegir aquí. */
  .mdm-slash-naming {
    position: fixed;
    z-index: 1000;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    padding: 6px 10px;
    font-size: 12px;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  /* ---------- vista previa de página al pasar el ratón por un wikilink ---------- */
  .mdm-link-preview {
    position: fixed;
    z-index: 1000;
    width: 260px;
    max-height: 150px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    padding: 12px 14px;
    pointer-events: none; /* que no compita con el hover del propio enlace */
  }
  .mdm-link-preview-title {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mdm-link-preview-body {
    font-size: 12.5px;
    color: var(--ink-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .backlinks-list { display: flex; flex-direction: column; gap: 4px; }
  .backlink-item {
    padding: 7px 10px;
    border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    cursor: pointer;
    font-size: 13px;
  }
  .backlink-item:hover { border-color: var(--accent); }

  /* ---------- vista de database ---------- */
  .db-header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .db-title {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    border: none;
    background: none;
    color: var(--ink);
    padding: 2px 0;
    min-width: 160px;
  }
  .db-schema-hint { font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; }
  .view-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .view-tab {
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--ink-muted);
  }
  .view-tab.active { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }

  table.rows-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .rows-table th, .rows-table td {
    text-align: left;
    padding: 7px 11px;
    border-bottom: 1px solid var(--panel-border);
    font-variant-numeric: tabular-nums;
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Cabecera: mono, versalitas y --surface-elevated, para que la fila de
     títulos se lea como cabecera y no como una fila más. */
  .rows-table th {
    background: var(--surface-elevated);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    font-weight: 600;
  }
  /* Primera columna = títulos de fila: es la jerarquía de la tabla. */
  .rows-table td:first-child { font-weight: 600; color: var(--ink); }
  .rows-table tr:hover td { background: var(--code-bg); }
  .rows-table td:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
  /* Scroll horizontal propio y SIEMPRE visible: a 1024 px la tabla mide
     ~947 px de ancho natural contra los ~663 px útiles del panel, así que
     sin esto se recortaban columnas sin avisar (auditoría, §2.6). */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    background: var(--panel);
    scrollbar-width: thin;
    scrollbar-color: var(--border-input) transparent;
  }
  .table-wrap::-webkit-scrollbar { height: 10px; }
  .table-wrap::-webkit-scrollbar-track { background: var(--bg); border-top: 1px solid var(--panel-border); }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--border-input); border-radius: 5px; border: 2px solid var(--bg); }
  .table-wrap table { margin: 0; }

  .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
  /* Cada carril es un contenedor visual propio (--bg sobre el --panel del
     lienzo): así se ve dónde empieza y acaba la columna, no solo el hueco. */
  .board-col {
    flex: 0 0 256px;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color var(--dur-fast) var(--ease-std), background-color var(--dur-fast) var(--ease-std);
  }
  /* Destino del arrastre: se marca la columna entera (SPEC-B §3.7). */
  .board-col.is-dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
    outline: 1px dashed var(--accent);
    outline-offset: -3px;
  }
  .board-col-head {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
    padding: 2px 4px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .board-card {
    background: var(--surface-elevated);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    font-size: 12.5px;
    cursor: pointer;
    box-shadow: var(--shadow-card);
    transition: border-color var(--dur-fast) var(--ease-std), transform var(--dur-fast) var(--ease-std);
  }
  .board-card:hover { border-color: var(--accent); }
  /* La tarjeta que se está arrastrando se queda "fantasma" en su sitio. */
  .board-card.is-dragging { opacity: 0.45; border-style: dashed; }
  .board-card-title { font-weight: 600; margin-bottom: 6px; color: var(--ink); line-height: 1.35; }
  .board-card-prop { color: var(--ink-muted); font-size: var(--text-sm); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .row-del, .cell-del {
    color: var(--ink-muted);
    background: none;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    width: var(--control-size);
    height: var(--control-size);
    min-width: 28px;
    min-height: 28px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .row-del:hover, .cell-del:hover { color: var(--down); background: var(--down-bg); border-color: var(--down); }

  /* ---------- formularios ---------- */
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--ink-muted); }
  .field input, .field select, .field textarea {
    padding: 6px 9px;
    border-radius: 6px;
    border: 1px solid var(--border-input);
    background: var(--bg);
    color: var(--ink);
  }
  .inline-form {
    margin-top: 12px;
    padding: 14px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: var(--panel);
  }

  /* ---------- dialogs ---------- */
  dialog {
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px;
    background: var(--panel);
    color: var(--ink);
    width: min(440px, 92vw);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
  dialog h3 { font-family: var(--font-mono); margin: 0 0 14px; font-size: 16px; }
  .prop-row-wrap { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--panel-border); }
  .prop-row-wrap:last-child { border-bottom: none; }
  .prop-row { display: grid; grid-template-columns: 1fr 1fr 100px auto; gap: 6px; align-items: center; }
  .prop-row input, .prop-row select { padding: 5px 7px; border-radius: 5px; border: 1px solid var(--border-input); background: var(--bg); color: var(--ink); font-size: 12.5px; }
  .prop-options-input { width: 100%; margin-top: 6px; padding: 5px 7px; border-radius: 5px; border: 1px solid var(--border-input); background: var(--bg); color: var(--ink); font-size: 12.5px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* ---------- avisos de error (toasts) ----------
     Cuelgan de document.body, no de #main (ver showError en app.js): así
     siguen visibles al navegar y no se los lleva por delante el siguiente
     render. Se apilan de abajo arriba en la esquina inferior derecha. */
  .error-toasts {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 1200; /* por encima del índice (900) y de los menús flotantes (1000) */
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    max-width: min(360px, calc(100vw - 36px));
    pointer-events: none; /* el hueco entre avisos no se come clics */
  }
  .error-toast {
    pointer-events: auto;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 10px 9px 12px;
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--down);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font-size: 12.5px;
    line-height: 1.35;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    animation: mdm-toast-in 0.16s ease-out;
  }
  @keyframes mdm-toast-in { from { opacity: 0; transform: translateY(4px); } }
  .error-toast-text { flex: 1 1 auto; overflow-wrap: anywhere; }
  .error-toast-close {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    min-width: 28px;
    min-height: 28px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: none;
    color: var(--ink-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .error-toast-close:hover { color: var(--down); background: var(--down-bg); border-color: var(--down); }
  /* En pantallas pequeñas ocupan el ancho útil en vez de una columna estrecha
     pegada a la derecha. */
  @media (max-width: 600px) {
    .error-toasts { right: 10px; left: 10px; bottom: 10px; align-items: stretch; max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .error-toast { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <!-- Set de iconos vectoriales (docs/diseno/iconos.svg, SPEC-B §6.5): 20
       <symbol> de 24x24 que usan currentColor y heredan el color del tema.
       Cada icono se pinta con <svg class="svg-icon"><use href="#i-*"/></svg>
       (ver svgIcon() en app.js). -->
  <svg xmlns="http://www.w3.org/2000/svg" id="mdm-icon-sprite" aria-hidden="true" focusable="false" style="display:none">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
      <symbol id="i-file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-grip-vertical" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="i-arrow-left-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m18 8 4 4-4 4"/><path d="M2 12h20"/><path d="m6 8-4 4 4 4"/></symbol>
      <symbol id="i-list-tree" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M3 6v4c0 1.1.9 2 2 2h3"/><path d="M3 10v6c0 1.1.9 2 2 2h3"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    </defs>
  </svg>

  <header>
    <div class="header-left">
      <button class="icon-btn" id="btn-toggle-sidebar" title="Mostrar/ocultar barra lateral" aria-label="Mostrar u ocultar barra lateral"><svg class="svg-icon icon-18" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg></button>
      <span class="brand"><img src="/logo.png" alt="" class="brand-logo" />MyDamnManagement</span>
      <div class="nav-history-controls">
        <button class="icon-btn" id="btn-nav-home" title="Ir al inicio" aria-label="Ir al inicio"><svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#i-home"/></svg></button>
        <button class="icon-btn" id="btn-nav-back" title="Atrás" aria-label="Atrás" disabled><svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#i-arrow-left"/></svg></button>
        <button class="icon-btn" id="btn-nav-forward" title="Adelante" aria-label="Adelante" disabled><svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#i-arrow-right"/></svg></button>
        <button class="icon-btn" id="btn-nav-up" title="Subir un nivel" aria-label="Subir un nivel" disabled><svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#i-arrow-up"/></svg></button>
      </div>
    </div>
    <div class="status-strip">
      <span class="status-item"><span class="dot" id="dot-api"></span>api</span>
      <span class="status-item"><span class="dot" id="dot-db"></span>db</span>
      <!-- Interruptor de tema (SPEC-B §1.1). El icono visible lo decide el
           data-theme del <html>: sol en oscuro (pasar a claro) y luna en claro. -->
      <button type="button" class="icon-btn" id="btn-toggle-theme" title="Cambiar a tema claro" aria-label="Cambiar entre tema oscuro y claro" aria-pressed="false">
        <svg class="svg-icon theme-icon-light" aria-hidden="true" focusable="false"><use href="#i-sun"/></svg>
        <svg class="svg-icon theme-icon-dark" aria-hidden="true" focusable="false"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="Buscar…" />
      </div>
      <div id="search-results" class="search-results" hidden></div>

      <div id="nav-sections">
        <div class="sidebar-section">
          <div class="sidebar-section-head">
            <span>Páginas</span>
            <button class="icon-btn" id="btn-new-note" title="Nueva nota" aria-label="Nueva nota"><svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
          </div>
          <div id="tree-container"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-head">
            <span>Bases de datos</span>
            <div class="btn-row" style="gap: 4px;">
              <button class="template-btn" id="btn-template-crm" title="Nueva base de datos desde la plantilla CRM (Contactos)">CRM</button>
              <button class="template-btn" id="btn-template-tasks" title="Nueva base de datos desde la plantilla de Tareas">Tareas</button>
              <button class="icon-btn" id="btn-new-database" title="Nueva base de datos en blanco" aria-label="Nueva base de datos en blanco"><svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
            </div>
          </div>
          <div id="db-tree-container"></div>
        </div>
      </div>
    </aside>

    <main id="main">
      <div class="empty-state">Elige una página o crea una nueva.</div>
    </main>
  </div>

  <dialog id="dialog-database">
    <h3 id="db-dialog-title">Nueva base de datos</h3>
    <div class="field">
      <label for="db-name">Nombre</label>
      <input type="text" id="db-name" placeholder="Contactos" />
    </div>
    <div class="field">
      <label>Propiedades</label>
      <div id="prop-rows"></div>
      <button type="button" class="btn" id="btn-add-prop" style="align-self: flex-start; margin-top: 4px;"><svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg>Propiedad</button>
    </div>
    <div class="dialog-actions">
      <button class="btn" id="btn-cancel-database">Cancelar</button>
      <button class="btn btn-primary" id="btn-save-database">Crear</button>
    </div>
  </dialog>

  <dialog id="dialog-view">
    <h3>Nueva vista</h3>
    <div class="field">
      <label for="view-name">Nombre</label>
      <input type="text" id="view-name" placeholder="Ganados" />
    </div>
    <div class="field">
      <label for="view-type">Tipo</label>
      <select id="view-type">
        <option value="table">Tabla</option>
        <option value="board">Tablero (board)</option>
        <option value="list">Lista</option>
        <option value="calendar">Calendario</option>
      </select>
    </div>
    <div class="field" id="view-groupby-field" hidden>
      <label for="view-groupby">Agrupar por</label>
      <select id="view-groupby"></select>
    </div>
    <div class="dialog-actions">
      <button class="btn" id="btn-cancel-view">Cancelar</button>
      <button class="btn btn-primary" id="btn-create-view">Crear</button>
    </div>
  </dialog>

  <!-- Editar la fila de una tarjeta del tablero: los mismos controles por tipo
       que la tabla, en un diálogo (una tarjeta no da sitio para editarla). -->
  <dialog id="dialog-row">
    <h3>Editar fila</h3>
    <div class="field">
      <label for="row-title">Título</label>
      <input type="text" id="row-title" />
    </div>
    <div id="row-props"></div>
    <div class="dialog-actions">
      <button class="btn" id="btn-cancel-row">Cancelar</button>
      <button class="btn btn-primary" id="btn-save-row">Guardar</button>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
