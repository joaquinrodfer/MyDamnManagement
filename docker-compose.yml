services:
  api:
    build:
      context: . # raíz del repo, no ./backend -- así el Dockerfile puede copiar frontend/ también
      dockerfile: backend/Dockerfile
    container_name: mdm_api
    restart: unless-stopped
    environment:
      # Un único fichero SQLite, sin servicio de base de datos ni puerto 5432.
      # El volumen `mdm_data` lo deja fuera del repo.
      INDEX_PATH: /data/index.sqlite
      DEFAULT_USER_NAME: ${DEFAULT_USER_NAME:-Tú}
    volumes:
      - ./backend/app:/app/app # hot-reload en desarrollo (Windows y Linux por igual)
      - ./frontend:/app/frontend:ro # panel de estado; estático, sin build
      - attachments:/app/attachments
      - mdm_data:/data # índice SQLite: fuera del repo, respaldable por separado
    ports:
      - "8000:8000"
    # Sin `alembic upgrade head`: el esquema del índice se crea/migra al
    # arrancar la app (PRAGMA user_version).
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  attachments:
  mdm_data:
