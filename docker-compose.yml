services:
  api:
    build:
      context: . # raíz del repo, no ./backend -- así el Dockerfile puede copiar frontend/ también
      dockerfile: backend/Dockerfile
    container_name: mdm_api
    restart: unless-stopped
    environment:
      # Un único fichero SQLite como índice, sin servicio de base de datos ni
      # puerto 5432. El vault de ficheros `.md` vive en su propio volumen: es la
      # verdad de las notas y lo que hay que respaldar.
      INDEX_PATH: /data/index.sqlite
      VAULT_PATH: /data/vault
      DEFAULT_USER_NAME: ${DEFAULT_USER_NAME:-Tú}
    volumes:
      - ./backend/app:/app/app # hot-reload en desarrollo (Windows y Linux por igual)
      - ./frontend:/app/frontend:ro # panel de estado; estático, sin build
      - mdm_data:/data # índice SQLite: fuera del repo, respaldable por separado
      - mdm_vault:/data/vault # las notas (.md) y sus adjuntos: esto es el backup
    ports:
      - "8000:8000"
    # Sin `alembic upgrade head`: el esquema del índice se crea/migra al
    # arrancar la app (PRAGMA user_version).
    # `--log-config` pone el handler de los loggers `mdm.*`: sin él uvicorn
    # configura solo los suyos y todo el INFO de la app (el resumen del
    # reindexado, los cambios del vault, una línea por sugerencia de agente)
    # se queda por debajo del único handler que había (`lastResort`, WARNING+).
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-config logging.json"

volumes:
  mdm_data:
  mdm_vault:

