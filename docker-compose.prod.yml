# Despliegue de producción: el código va DENTRO de la imagen, sin recarga en
# caliente, con un healthcheck que mira el índice y el vault de verdad, y con
# el puerto publicado SOLO en loopback para que delante vaya `tailscale serve`
# (paso a paso en la sección "Despliegue" del README.md).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# `docker-compose.yml` se queda como está: es el de desarrollo (bind-mounts de
# `backend/app` y `frontend`, `--reload`). Este fichero es autónomo, no un
# override: se usa solo, y nunca se combina con el de desarrollo.
#
# El nombre del proyecto se fija aquí para que los volúmenes no dependan del
# directorio desde el que se clone el repo: se llaman `mdm-prod_mdm_vault` y
# `mdm-prod_mdm_data`, y el README los nombra así en el backup y el restore.
name: mdm-prod

services:
  api:
    build:
      context: . # raíz del repo: el Dockerfile copia backend/ y frontend/ dentro de la imagen
      dockerfile: backend/Dockerfile
    image: mydamnmanagement:prod
    container_name: mdm_api_prod
    restart: unless-stopped
    environment:
      # Un único fichero SQLite como índice, sin servicio de base de datos y sin
      # puerto 5432. El vault de ficheros `.md` vive en su propio volumen: es la
      # verdad de las notas y lo único que hay que respaldar (README, "Backup").
      INDEX_PATH: /data/index.sqlite
      VAULT_PATH: /data/vault
      # Usuarios y sesiones (P11a). NADA de secretos en este fichero: si
      # quieres que el primer administrador se cree al arrancar, pon
      # ADMIN_USER y ADMIN_PASSWORD en el `.env` del servidor y el compose
      # las pasa; si no están, el alta se hace desde la pantalla de
      # `/login`. Con usuarios ya en el índice no hacen nada.
      #
      # No hay `SESSION_SECRET`: las sesiones viven en la base y lo que
      # viaja es un token aleatorio (se guarda su SHA-256), no un JWT
      # firmado. `SESSION_COOKIE_SECURE` no se fija: se deduce de
      # `X-Forwarded-Proto`, que es lo que manda `tailscale serve`.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # OBSOLETO desde P11a (el creador sale de la sesión): se pasa por si
      # algún despliegue viejo lo tiene en su `.env`, pero ya no se usa.
      DEFAULT_USER_NAME: ${DEFAULT_USER_NAME:-Tú}
      DOCS_ENABLED: "0" # apaga /docs, /redoc y /openapi.json en producción
    # Solo datos. Nada de `./backend/app` ni `./frontend`: el código ya está en
    # la imagen (`backend/Dockerfile` los copia) y montarlo encima reintroduciría
    # justo el hot-reload que este fichero existe para quitar.
    volumes:
      - mdm_data:/data # índice SQLite: derivado, se reconstruye desde el vault
      - mdm_vault:/data/vault # las notas, bases, filas y adjuntos: el backup
    # 127.0.0.1, no "8000:8000": desde fuera solo se alcanza a través de la
    # propia máquina. `tailscale serve` (en el host) termina el TLS y habla con
    # esta dirección; sin él, la app no sale a ninguna interfaz de red.
    # Publicar aquí "8000:8000" deja el puerto al alcance de toda la red: la
    # app pide sesión (v1.3), pero la frontera pensada sigue siendo
    # Tailscale y este fichero es lo que la mantiene.
    ports:
      - "127.0.0.1:8000:8000"
    # Un solo worker a propósito: cada worker reindexa el vault entero en su
    # arranque (`app.main.on_startup`) y el índice es un SQLite con un único
    # escritor. Con `--workers > 1` son N reindexados simultáneos sobre el mismo
    # fichero y N procesos escribiendo: contenido y bloqueos, no rendimiento.
    # Para un cerebro personal en un solo equipo, un worker sobra; si algún día
    # hace falta más, primero hay que sacar el reindexado del arranque.
    #
    # `0.0.0.0` es la interfaz DENTRO del contenedor (docker solo la publica en
    # 127.0.0.1 del host, ver `ports`). `--proxy-headers` y
    # `--forwarded-allow-ips` hacen que el log de acceso muestre la IP del
    # cliente y no la del proxy de `tailscale serve`.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
      --proxy-headers --forwarded-allow-ips=* --log-level info
      --log-config logging.json
    healthcheck:
      # Desde P11a `/status` (como todo) pide sesión, y el healthcheck no tiene
      # credenciales ni debe tenerlas. Así que se comprueba desde dentro del
      # contenedor lo mismo que se miraba en `/status`: que el proceso contesta
      # en `/health` (la única ruta de estado pública) y que el índice y el
      # vault se pueden leer de verdad. El motivo de un fallo aparece en
      # `docker inspect --format '{{json .State.Health}}' mdm_api_prod`.
      #
      # Sin `curl` a propósito: sería una dependencia más en
      # `python:3.12-slim-bookworm` solo para esto.
      test:
        - CMD
        - python
        - -c
        - |
          import json, os, sqlite3, sys, urllib.request


          def fail(msg):
              print("healthcheck: " + msg, file=sys.stderr)
              sys.exit(1)


          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=10) as resp:
                  if json.load(resp).get("status") != "ok":
                      fail("/health no dice ok")
          except Exception as exc:
              fail("la API no responde en /health: " + repr(exc))

          vault = os.environ.get("VAULT_PATH", "/data/vault")
          if not os.path.isdir(vault):
              fail("no existe el vault " + vault + " (¿volumen sin montar?)")

          en_vault = 0
          for raiz, dirs, ficheros in os.walk(vault):
              # `.trash` no son notas: las borradas no cuentan como contenido.
              dirs[:] = [d for d in dirs if d != ".trash"]
              en_vault += sum(1 for f in ficheros if f.endswith(".md"))

          index = os.environ.get("INDEX_PATH", "/data/index.sqlite")
          try:
              conn = sqlite3.connect("file:" + index + "?mode=ro", uri=True, timeout=10)
              try:
                  version = conn.execute("PRAGMA user_version").fetchone()[0]
                  pages = conn.execute("SELECT count(*) FROM pages").fetchone()[0]
              finally:
                  conn.close()
          except Exception as exc:
              fail("el índice no se puede leer: " + repr(exc))

          # Un índice que se puede ABRIR no es un índice CON contenido. Si el
          # fichero del índice desaparece con la app en marcha, `ensure_index`
          # recrea uno vacío en la siguiente consulta: `db.ok` seguía siendo
          # true con `counts.pages == 0`, la API servía el panel vacío y el
          # contenedor se quedaba `healthy` para siempre (`restart:
          # unless-stopped` no reinicia por `unhealthy`). Ese es el susto que
          # este chequeo evita.
          if pages == 0 and en_vault > 0:
              fail(
                  "el índice está vacío (%s páginas) pero hay %d ficheros en el "
                  "vault %s: POST /reindex o reinicia el contenedor"
                  % (pages, en_vault, vault)
              )

          print(
              "ok: índice v%s, %s páginas, %s ficheros del vault"
              % (version, pages, en_vault)
          )
      interval: 30s
      timeout: 15s
      retries: 3
      # El arranque reindexa el vault entero (0,32 s medidos con 5.033 notas):
      # este margen evita contar como caído un arranque normal.
      start_period: 60s
    # stdout/stderr, sin ficheros ni rotación propia: `docker logs mdm_api_prod`.
    # La rotación la hace el driver de Docker (abajo), no la app.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mdm_data:
  mdm_vault:
